name: ci

on:
  push:
    branches: [main]
    # A change that only touches what the build and the tests do not read needs no run: the documents (they have their own
    # workflow, docs.yml), the licenses, and what only the release workflow uses.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.ja.md"
      - "CONTRIBUTING.md"
      - "LICENSE-*"
      - "editors/nvim/README.md"
      - "tools/build-docs.sh"
      - ".github/workflows/docs.yml"
      # The release is made by its own workflow, and nothing here runs what it uses.
      - "tools/package-release.sh"
      - ".github/release-notes.md"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.ja.md"
      - "CONTRIBUTING.md"
      - "LICENSE-*"
      - "editors/nvim/README.md"
      - "tools/build-docs.sh"
      - ".github/workflows/docs.yml"
      # The release is made by its own workflow, and nothing here runs what it uses.
      - "tools/package-release.sh"
      - ".github/release-notes.md"
      - ".github/workflows/release.yml"

permissions:
  contents: read

# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # rustfmt and clippy are tools of the people who write the code, not of the least version that builds it: they run
  # on the latest stable toolchain. A release that adds a lint can turn a run red with no change of the code; the code
  # is then made to pass it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # A broken link in the documentation is a bug of the documentation.
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The tests run on the least version that rust-version names (1.88) and on the latest stable, on Linux, and on the latest
  # stable on macOS (the other system with Unix sockets that the server runs on; it is also where launchd is tried) and on
  # Windows (where the adapters connect over a named pipe, and Task Scheduler is tried).
  # They also run the Neovim adapter in a headless Neovim: the least version that it supports (0.11) goes with the least
  # Rust, the newest with the others. A fixed release, so that a new one cannot turn a run red with no change of the
  # code; it is raised on purpose, together with the checksum (the `digest` of the asset in the release). The packages
  # of the systems are older than the adapter needs.
  test:
    # Without a name the job is called after every value of the matrix, checksums included.
    name: test (${{ matrix.os }}, rust ${{ matrix.toolchain }}, nvim ${{ matrix.nvim_version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, toolchain: "1.88", nvim_version: v0.11.7, nvim_asset: nvim-linux-x86_64, nvim_archive: tar.gz, nvim_sha256: 38a7c6317f94503841096c00e8fde05ef04b9472fc9d7d62b6e033cecd6f7991 }
          - { os: ubuntu-latest, toolchain: stable, nvim_version: v0.12.6, nvim_asset: nvim-linux-x86_64, nvim_archive: tar.gz, nvim_sha256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87 }
          - { os: macos-latest, toolchain: stable, nvim_version: v0.12.6, nvim_asset: nvim-macos-arm64, nvim_archive: tar.gz, nvim_sha256: 1dbd148222b051ba6c307c4d17a318ed083df018a4f6a5a0ce46955ffc9ab87b }
          - { os: windows-latest, toolchain: stable, nvim_version: v0.12.6, nvim_asset: nvim-win64, nvim_archive: zip, nvim_sha256: 4e12b7103b601ffc8f25954b4da100f339faa73dccb69a5b135e897fa3d893ed }
    runs-on: ${{ matrix.os }}
    # The same shell (bash, which Windows runners have) for every system.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal && rustup default ${{ matrix.toolchain }}
      - name: Neovim
        if: matrix.nvim_asset
        run: |
          base="https://github.com/neovim/neovim/releases/download/${{ matrix.nvim_version }}"
          archive="${{ matrix.nvim_asset }}.${{ matrix.nvim_archive }}"
          curl -fsSL -o "$archive" "$base/$archive"
          # Checked before it is unpacked, let alone run.
          if command -v sha256sum > /dev/null; then check="sha256sum -c -"; else check="shasum -a 256 -c -"; fi
          echo "${{ matrix.nvim_sha256 }}  $archive" | $check
          case "$archive" in
            *.zip) powershell -NoProfile -Command "Expand-Archive -Path '$archive' -DestinationPath ." ;;
            *) tar xzf "$archive" ;;
          esac
          bin="$PWD/${{ matrix.nvim_asset }}/bin"
          # The path file of the runner wants a path of Windows on Windows.
          if command -v cygpath > /dev/null; then bin="$(cygpath -w "$bin")"; fi
          echo "$bin" >> "$GITHUB_PATH"
      - run: nvim --version
        if: matrix.nvim_asset
      # Built on their own, so that a run that fails says whether the build failed or a test did, and how long each took.
      - name: Build the tests
        run: cargo test --workspace --locked --no-run
      # The tests of the Neovim adapter are skipped on a machine without nvim; here they must run.
      - name: Run the tests
        run: cargo test --workspace --locked
        env:
          CLAUDE_IDE_REQUIRE_NVIM: "1"
          # The test of the server under launchd needs a domain of launchd that a user agent can be loaded into: the macOS
          # runner has one (gui/<uid>), and a runner that stops having it must be noticed, not skipped.
          CLAUDE_IDE_REQUIRE_LAUNCHD: "1"
          # The test of the server under Task Scheduler uses the paths of the user, which a task cannot be told otherwise, so
          # it runs only where it is asked to: here, on a runner that has nothing of the user's.
          CLAUDE_IDE_TRY_TASK_SCHEDULER: "1"
