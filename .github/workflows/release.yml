name: release

# A tag `v<version>` (the version of Cargo.toml) builds the executable for each system, packs it with the Neovim adapter, and
# leaves a draft release for a person to look at and publish. A run by hand (`workflow_dispatch`) does everything but the
# release itself, to see what a release would hold.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The executable, built on a runner of its own system (except for macOS on Intel, see below), and started once to see that
  # it runs at all. Linux is built for musl, so that it is one file with no libc of the system to match: it runs on any
  # distribution of that CPU. The target's own runtime (`rustup target add`) is all that it needs: there is no C code in the
  # dependencies of the executable, so no `musl-tools` is installed (which would also make a build wait for the mirrors of
  # the distribution).
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Built on the Arm runner (there is no cross toolchain to install: Xcode has both), and run through Rosetta.
          - { target: x86_64-apple-darwin, os: macos-latest, rosetta: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Build
        run: cargo build --release --locked --package claude-ide-server --target ${{ matrix.target }}
      - name: Does it run?
        run: |
          exe="target/${{ matrix.target }}/release/claude-ide-server${{ matrix.exe }}"
          run() { if [ "${{ matrix.rosetta }}" = true ]; then arch -x86_64 "$@"; else "$@"; fi; }
          run "$exe" --version
          # The place that the adapters look for; it needs the home and the runtime directory of the user, and no server.
          run "$exe" --print-socket
          if [ "${{ matrix.musl }}" = true ]; then
            # Static: no libc of the system to match.
            file "$exe"
            ! ldd "$exe" 2>&1 | grep -q 'libc\.so'
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/claude-ide-server${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

  # The archives, all packed on Linux by one script (tools/package-release.sh), so that they do not depend on the tools of
  # the system that built the executable; and the checksums, and the provenance of the files.
  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "claude-ide-server") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::the tag is ${GITHUB_REF_NAME}, and Cargo.toml says version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bin
      - name: Pack
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir dist
          for dir in bin/bin-*; do
            target="${dir#bin/bin-}"
            exe=$(ls "$dir"/claude-ide-server*)
            tools/package-release.sh server "$version" "$target" "$exe" dist
          done
          tools/package-release.sh nvim "$version" dist
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Provenance
        # A run by hand is a dry run: it makes nothing that is signed in the name of the project.
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # A draft, so that a person reads it before it is public; and a prerelease while the version is 0.x.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.package.outputs.version }}"
          flags="--draft"
          case "$version" in 0.*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md --generate-notes dist/*
