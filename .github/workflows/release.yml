name: release

# A tag `v<version>` (the version of Cargo.toml) builds the executable for each system, packs it with the Neovim adapter, makes
# a release of the files, and publishes the crates to crates.io. Nothing waits for a person: what is checked is checked before
# the tag is pushed (see "Releasing" in CONTRIBUTING.md). A run by hand (`workflow_dispatch`) does everything but the release
# and the publication, to see what a release would hold.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The executable, built on a runner of its own system (except for macOS on Intel, see below), and started once to see that
  # it runs at all. Linux is built for musl, so that it is one file with no libc of the system to match: it runs on any
  # distribution of that CPU. The glibc builds are for those who want a dynamic one (and for `cargo binstall`, which looks
  # for them). The target's own runtime (`rustup target add`) is all that it needs: there is no C code in the
  # dependencies of the executable, so no `musl-tools` is installed (which would also make a build wait for the mirrors of
  # the distribution).
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          # The glibc builds are made on the oldest image there is (Ubuntu 22.04, glibc 2.35): an executable needs the glibc that
          # it was built against, or a newer one, so what is built on a new image runs on the new systems only. What these ask
          # for is glibc 2.34 (see "Does it run?"), which is what RHEL 9 has.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, glibc: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, glibc: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Built on the Arm runner (there is no cross toolchain to install: Xcode has both), and run through Rosetta.
          - { target: x86_64-apple-darwin, os: macos-latest, rosetta: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Build
        run: cargo build --release --locked --package claude-ide-server --target ${{ matrix.target }}
      - name: Does it run?
        run: |
          exe="target/${{ matrix.target }}/release/claude-ide-server${{ matrix.exe }}"
          run() { if [ "${{ matrix.rosetta }}" = true ]; then arch -x86_64 "$@"; else "$@"; fi; }
          run "$exe" --version
          # The place that the adapters look for; it needs the home and the runtime directory of the user, and no server.
          run "$exe" --print-socket
          if [ "${{ matrix.musl }}" = true ]; then
            # Static: no libc of the system to match.
            file "$exe"
            ! ldd "$exe" 2>&1 | grep -q 'libc\.so'
          fi
          if [ "${{ matrix.glibc }}" = true ]; then
            # The newest version of glibc that the executable asks for: it is what the system that runs it must have.
            need=$(objdump -T "$exe" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1)
            echo "needs $need"
            # What the release notes say: asking for more would mean that the image or the toolchain has moved on, and the
            # claim in the notes is wrong.
            [ "$(printf '%s\n' "$need" GLIBC_2.34 | sort -V | tail -n 1)" = GLIBC_2.34 ]
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/claude-ide-server${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

  # The archives, all packed on Linux by one script (tools/package-release.sh), so that they do not depend on the tools of
  # the system that built the executable; and the checksums, and the provenance of the files.
  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "claude-ide-server") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::the tag is ${GITHUB_REF_NAME}, and Cargo.toml says version $version"
            exit 1
          fi
          # The crates that are published carry that version, and ask for it of each other: a crate that asks for another
          # version would be built, when it is published, against what crates.io has of that one, and nothing would say so.
          wrong=$(cargo metadata --no-deps --format-version 1 --locked | jq -r --arg v "$version" '
            .packages[] | select(.source == null and .publish != []) | .name as $name
            | (select(.version != $v) | "\($name) is version \(.version)"),
              (.dependencies[] | select(.path != null and .kind != "dev" and .req != "^" + $v)
                | "\($name) asks for \(.name) \(.req)")')
          if [ -n "$wrong" ]; then
            echo "::error::not at version $version: $wrong"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bin
      - name: Pack
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir dist
          for dir in bin/bin-*; do
            target="${dir#bin/bin-}"
            exe=$(ls "$dir"/claude-ide-server*)
            tools/package-release.sh server "$version" "$target" "$exe" dist
          done
          tools/package-release.sh nvim "$version" dist
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Provenance
        # A run by hand is a dry run: it makes nothing that is signed in the name of the project.
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # The crates, to crates.io, from the same commit as the files of the release. Trusted publishing: the job gives crates.io what
  # GitHub says of this run (the repository, this workflow, the environment) and gets a token that lasts a few minutes, so there
  # is no secret to keep. The environment `crates-io` is open to the runs of tags only (it is set in the settings of the
  # repository), and crates.io is told of that too: a publication cannot be taken back, and nobody is asked before it.
  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # A prerelease only if the version says so (`0.2.0-rc.1`): 0.x is a release, and the latest one, which is what
      # `gh release download` and `cargo binstall` look for.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.package.outputs.version }}"
          flags=""
          case "$version" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md --generate-notes dist/*
