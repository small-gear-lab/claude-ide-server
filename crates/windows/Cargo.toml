[package]
name = "claude-ide-windows"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The calls to Windows that need unsafe, wrapped so that nothing else needs it"
publish = false

# Not `workspace = true`: the workspace forbids unsafe code, and this crate is, with `claude-ide-launchd`, the one place
# that has a reason for it (calls to the system, with raw pointers and handles). It is denied, and allowed at each place
# in `src/lib.rs` where it is needed, with the reason written down.
[lints.rust]
unsafe_code = "deny"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.54.1", features = ["net"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1.54.1", features = ["net", "macros", "rt"] }
