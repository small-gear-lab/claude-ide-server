[package]
name = "claude-ide-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Claude Code /ide protocol server for editors"
publish = false

[lints]
workspace = true

[[bin]]
name = "claude-ide-server"
path = "src/main.rs"

[dependencies]
claude-ide-core = { path = "../core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[target.'cfg(unix)'.dependencies]
listenfd = "1.0.2"
rustix = { version = "1.1.6", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
claude-ide-launchd = { path = "../launchd" }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.154"
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
futures-util = "0.3.34"
claude-ide-core = { path = "../core", features = ["test-support"] }
