[package]
name = "claude-ide-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Claude Code /ide protocol server (editor-agnostic core)"
publish = false

[lints]
workspace = true

[features]
# Lets tests replace what is fixed in production, such as the source of the token. Never on in a normal build.
test-support = []

[dependencies]
futures-util = "0.3.34"
getrandom = "0.4.3"
rmcp = { version = "3.9.0", default-features = false, features = ["server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target.'cfg(windows)'.dependencies]
claude-ide-windows = { path = "../windows" }

[dev-dependencies]
# The tests of this crate use its own `test-support` feature.
claude-ide-core = { path = ".", features = ["test-support"] }
claude-ide-test-support = { path = "../test-support" }
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
