[package]
name = "claude-ide-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Claude Code /ide protocol server (editor-agnostic core)"
publish = false

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
getrandom = "0.4.3"
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
