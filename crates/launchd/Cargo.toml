[package]
name = "claude-ide-launchd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unofficial: launchd's socket activation on macOS for claude-ide-server, the one call wrapped so that nothing else needs unsafe"
readme = "README.md"
keywords = ["launchd", "macos", "socket-activation"]
categories = ["os::macos-apis"]

# Not `workspace = true`: the workspace forbids unsafe code, and this crate is the one place that has a reason for it
# (calling `launch_activate_socket`, and taking the file descriptors that it hands over). It is denied, and allowed in
# the three places in `src/lib.rs` where it is needed (the declaration of the C function and the two blocks that use
# it), each with the reason written down.
[lints.rust]
unsafe_code = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
