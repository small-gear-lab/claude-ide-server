[package]
name = "claude-ide-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "What the tests of the other crates share: the adapter's end of a connection, a stand-in for Claude Code, a workspace to start from, and the shapes of what Claude Code reads and sends"
publish = false

[lints]
workspace = true

[dependencies]
claude-ide-core = { path = "../core", features = ["test-support"] }
futures-util = "0.3.34"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
